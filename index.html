    <title>Oli - Procvičování pro ZŠ</title>
    <meta name="description" content="Oli připraví dítěti cvičení na míru podle ročníku a tématu. Krátké procvičování, nápověda po ruce, přehled pro rodiče. Bez registrace, 14 dní zdarma." />

    <!-- Open Graph — bez těchhle značek nemá odkaz sdílený na sociální síti
         ani v messengeru náhled, jen holou URL.
         `og:image` schválně chybí: náhledový obrázek 1200×630 zatím neexistuje
         a odkaz na neexistující soubor je horší než žádný. Až vznikne, přidat
         sem a přepnout twitter:card na summary_large_image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Oli" />
    <meta property="og:title" content="Oli — procvičování pro 1. stupeň ZŠ" />
    <meta property="og:description" content="Oli připraví dítěti cvičení na míru podle ročníku a tématu. Krátké procvičování, nápověda po ruce, přehled pro rodiče. Bez registrace, 14 dní zdarma." />
    <meta property="og:locale" content="cs_CZ" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Oli — procvičování pro 1. stupeň ZŠ" />
    <meta name="twitter:description" content="Oli připraví dítěti cvičení na míru podle ročníku a tématu. Krátké procvičování, nápověda po ruce, přehled pro rodiče. Bez registrace, 14 dní zdarma." />
  </head>
