name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (baseline guard — fails on NEW type errors)
        run: npm run typecheck:ci

      - name: UI audit (baseline guard — fails on NEW findings)
        run: npm run audit:ui

      - name: Run tests
        run: npm test

      - name: Content audit
        run: npm run audit:content

      # Audit vzorkuje, tenhle sweep projde všechna témata opakovaně.
      # Rozdíl není teoretický: 2026-09-12 hlásil jeden běh auditu nález
      # shody a další dva ne — vzorek rarity míjí. REPEATS=30 dá ~78 000
      # unikátních úloh za ~40 s.
      - name: Agreement lint (všechna témata, ne vzorek)
        run: npm run audit:agreement
        env:
          REPEATS: '30'

      # Klíč se přepočítá z textu zadání. Když tohle spadne, NEJDŘÍV ručně
      # přepočítej nález — šestkrát se ukázalo, že chybu má kontrola, ne obsah.
      - name: Key check (přepočet klíčů z zadání)
        run: npm run check:keys

      - name: Key check — tabulky a diagramy
        run: npm run check:keys:tables

      - name: Verify curriculum
        run: npm run verify:curriculum

  build:
    name: Build check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: build
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
